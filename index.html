              e("span",{style:{fontSize:13,color:"#aaa"}},mood.l),
              entry.weight?e("span",{style:{fontSize:14,fontWeight:700,marginLeft:"auto",color:"#185FA5"}},(+entry.weight).toFixed(1)+" kg"):null,
              entry.sleep?e("span",{style:{fontSize:13,color:"#aaa"}},"😴 "+entry.sleep+"u"):null
            ),
            entry.notes?e("div",{style:{fontSize:13,color:"#666",marginTop:8,lineHeight:1.6,borderTop:"1px solid rgba(0,0,0,0.06)",paddingTop:8}},entry.notes):null
          );
        })
      )
    );
  }

  var NAV=[{id:"vandaag",l:"Vandaag",ic:"🏊"},{id:"schema",l:"Schema",ic:"📅"},{id:"tips",l:"Tips",ic:"💡"},{id:"logboek",l:"Logboek",ic:"📊"}];
  return e("div",{style:{fontFamily:"-apple-system,BlinkMacSystemFont,sans-serif",maxWidth:600,margin:"0 auto",minHeight:"100vh",background:"#f0eeea"}},
    e("div",{style:{background:"#fff",padding:"16px 16px 0",borderBottom:"1px solid rgba(0,0,0,0.07)",position:"sticky",top:0,zIndex:10}},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}},
        e("div",null,
          e("div",{style:{fontSize:18,fontWeight:800,letterSpacing:"-0.02em"}},"IJsselmeer 2026"),
          e("div",{style:{fontSize:11,color:"#bbb",marginTop:2}},"4 september · 21 km · doel 6u15")
        ),
        e("span",{style:{fontSize:12,padding:"5px 12px",borderRadius:20,background:ph.bg,color:ph.c,fontWeight:700,whiteSpace:"nowrap"}},"Wk "+curWk+" · "+ph.n)
      ),
      e("div",{style:{display:"flex"}},
        NAV.map(function(n){return e("button",{key:n.id,onClick:function(){setTab(n.id);},style:{flex:1,padding:"8px 2px 11px",fontSize:11,background:"none",border:"none",borderBottom:"3px solid "+(tab===n.id?ph.c:"transparent"),color:tab===n.id?ph.c:"#bbb",cursor:"pointer",fontFamily:"inherit",fontWeight:tab===n.id?700:400,display:"flex",flexDirection:"column",alignItems:"center",gap:3}},e("span",{style:{fontSize:18}},n.ic),n.l);})
      )
    ),
    e("div",{style:{padding:"16px 16px 60px"}},
      tab==="vandaag"?renderVandaag():tab==="schema"?renderSchema():tab==="tips"?renderTips():renderLogboek()
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
