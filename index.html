    if(isCur){var cn=span("wk-now","nu");cn.style.background=p.bg;cn.style.color=p.c;wtl.appendChild(cn);}
    if(hasOW){var ow=span("wk-ow","🌊 OW");wtl.appendChild(ow);}
    if(hasMet){var me=span("wk-ow","🍫");me.style.background="#E1F5EE";me.style.color="#0F6E56";wtl.appendChild(me);}
    if(hasBch){var bc=span("wk-bch","📏 check");wtl.appendChild(bc);}
    var wdt=span("wk-dt",w.dates);
    var wvl=span("wk-vol",w.vol+" km");wvl.style.background=p.bg;wvl.style.color=p.c;
    var wcv=span("wk-cv",isOpen?"▲":"▼");
    ap(wh,dot,wtl,wdt,wvl,wcv);
    wh.addEventListener("click",function(){ST.openWk=isOpen?null:wn;render();});
    wr2.appendChild(wh);
    
    if(isOpen){
      var wd=div("wk-det");wd.style.display="block";
      var wss=div("wk-sess");
      allS.forEach(function(ss){
        var isOpt=ss.type==="optional";
        var wr3=div("ws"+(isOpt?" opt":""));
        var dy=span("ws-dy",ss.day);
        var ds=span("ws-ds"+(isOpt?" opt":""),ss.desc);
        var di=span("ws-di",ss.dist);
        ap(wr3,dy,mkBadge(ss.type),ds,di);
        wss.appendChild(wr3);
      });
      var wtp=div("wk-tip",w.tip);
      wtp.style.borderLeftColor=p.c;wtp.style.background=p.bg+"55";
      ap(wd,wss,wtp);
      wr2.appendChild(wd);
    }
    f.appendChild(wr2);
  });
  return f;
}
function buildTips(){
  var f=document.createDocumentFragment();
  var TCOLS={voeding:"#1D9E75",tempo:"#993C1D",ademhaling:"#185FA5",yoga:"#534AB7",algemeen:"#BA7517"};
  var TLABS={voeding:"🥗 Voeding",tempo:"⏱️ Tempo",ademhaling:"🌬️ Adem",yoga:"🧘 Yoga",algemeen:"💡 Tips"};
  var tr2=div("tt-row");
  Object.keys(TIPS).forEach(function(k){
    var b=el("button","tt-btn",TLABS[k]);
    b.style.background=ST.tTab===k?TCOLS[k]:"#fff";
    b.style.color=ST.tTab===k?"#fff":"#666";
    b.style.fontWeight=ST.tTab===k?"700":"400";
    b.addEventListener("click",function(){ST.tTab=k;render();});
    tr2.appendChild(b);
  });
  f.appendChild(tr2);
  var c2=TCOLS[ST.tTab];
  (TIPS[ST.tTab]||[]).forEach(function(item){
    var ti=div("ti");
    ti.style.borderLeftColor=c2;
    ap(ti,div("ti-t",item.t),div("ti-b",item.b));
    f.appendChild(ti);

}
function buildLogboek(){
  var f=document.createDocumentFragment();
  var allL=Object.entries(ST.logs).sort(function(a,b){return b[0]>a[0]?1:-1;}).slice(0,60);
  var wts=Object.entries(ST.logs).filter(function(a){return a[1].weight&&!isNaN(+a[1].weight);}).sort(function(a,b){return a[0]<b[0]?-1:1;}).slice(-20).map(function(a){return +a[1].weight;});
  var sleeps=allL.filter(function(a){return a[1].sleep&&!isNaN(+a[1].sleep);}).map(function(a){return +a[1].sleep;}).slice(0,7);
  var avgSleep=sleeps.length?Math.round(sleeps.reduce(function(a,b){return a+b;},0)/sleeps.length*10)/10:null;
  var mArr=allL.filter(function(a){return a[1].mood;}).map(function(a){return +a[1].mood;}).slice(0,7);
  var avgMV=mArr.length?mArr.reduce(function(a,b){return a+b;},0)/mArr.length:null;
  var moodInfo=avgMV?MOODS.reduce(function(p,c2){return Math.abs(c2.v-avgMV)<Math.abs(p.v-avgMV)?c2:p;}):null;
  
  var sg3=div("sg");
  [{l:"Gem. slaap",v:avgSleep?avgSleep+"u":"-",c:"#185FA5"},{l:"Gevoel (7d)",v:moodInfo?moodInfo.e:"-",c:"#534AB7"},{l:"Gewicht",v:wts.length?wts[wts.length-1].toFixed(1)+" kg":"-",c:"#1D9E75"}].forEach(function(card){
    var sc2=div("sc");
    var lbl=div("sl",card.l);var val=div("sv",card.v);val.style.color=card.c;
    ap(sc2,lbl,val);sg3.appendChild(sc2);
  });
  f.appendChild(sg3);
  
  // Chart
  f.appendChild(div("st-ttl","Gewichtsverloop"));
  if(wts.length>=2){
    var CW=300,CH=120,PL=38,PR=10,PT=10,PB=20;
    var IW=CW-PL-PR,IH=CH-PT-PB;
    var wMin=Math.min.apply(null,wts)-1,wMax=Math.max.apply(null,wts)+1;
    var logArr2=Object.entries(ST.logs).filter(function(a){return a[1].weight&&!isNaN(+a[1].weight);}).sort(function(a,b){return a[0]<b[0]?-1:1;}).slice(-20);
    var pts=logArr2.map(function(a,i){return {x:PL+(i/(logArr2.length-1))*IW,y:PT+IH-(+a[1].weight-wMin)/(wMax-wMin)*IH};});
    var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width",CW);svg.setAttribute("height",CH);svg.style.cssText="display:block;max-width:100%";
    [0,0.5,1].forEach(function(f2){
      var y=PT+f2*IH;
      var ln=document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1",PL);ln.setAttribute("y1",y);ln.setAttribute("x2",CW-PR);ln.setAttribute("y2",y);
      ln.setAttribute("stroke","rgba(0,0,0,.07)");ln.setAttribute("stroke-width","1");
      var tx=document.createElementNS("http://www.w3.org/2000/svg","text");
      tx.setAttribute("x",PL-4);tx.setAttribute("y",y+4);tx.setAttribute("font-size","10");tx.setAttribute("fill","#ccc");tx.setAttribute("text-anchor","end");
      tx.textContent=(wMax-f2*(wMax-wMin)).toFixed(1);
      svg.appendChild(ln);svg.appendChild(tx);
    });
    if(pts.length>=2){
      var path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d","M "+pts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" L "));
      path.setAttribute("fill","none");path.setAttribute("stroke","#185FA5");path.setAttribute("stroke-width","2.5");
      path.setAttribute("stroke-linecap","round");path.setAttribute("stroke-linejoin","round");
      svg.appendChild(path);
    }
    pts.forEach(function(p){
      var ci=document.createElementNS("http://www.w3.org/2000/svg","circle");
      ci.setAttribute("cx",p.x.toFixed(1));ci.setAttribute("cy",p.y.toFixed(1));ci.setAttribute("r","4");
      ci.setAttribute("fill","#185FA5");ci.setAttribute("stroke","#fff");ci.setAttribute("stroke-width","2");
      svg.appendChild(ci);
    });
    var cc=div("card");cc.style.overflowX="auto";cc.appendChild(svg);
    f.appendChild(cc);
  } else {
    f.appendChild(div("em","Log minstens 2 gewichtsmetingen voor een grafiek."));
  }
  
  f.appendChild(div("st-ttl","Alle logs"));
  if(allL.length===0){f.appendChild(div("em","Nog geen logs. Start via Vandaag."));return f;}
  allL.forEach(function(a){
    var key=a[0];var entry=a[1];
    var mood2=MOODS.filter(function(m){return m.v===+entry.mood;})[0]||MOODS[2];
    var d=new Date(key+"T12:00:00");
    var le2=div("le");
    var lr2=div("lr");
    var ld2=span("ld",d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"}));
    ap(lr2,ld2,span("",mood2.e),span("",mood2.l));
    lr2.children[1].style.fontSize="20px";
    lr2.children[2].style.cssText="font-size:13px;color:#aaa";
    if(entry.weight){var lw2=span("lw",(+entry.weight).toFixed(1)+" kg");lw2.style.color="#185FA5";lr2.appendChild(lw2);}
    if(entry.sleep){var ls=span("","  😴 "+entry.sleep+"u");ls.style.cssText="font-size:13px;color:#aaa";lr2.appendChild(ls);}
    ap(le2,lr2);
    if(entry.notes){ap(le2,div("ln",entry.notes));}
    f.appendChild(le2);
  });
  return f;
}
function buildCheck(){
  var f=document.createDocumentFragment();
  
  // Pace calculator
  f.appendChild(div("st-ttl","Tempoberekening"));
  var pc=div("card");
  ap(pc,div("","🔢 Vul een recente zwemprestatie in (pool of Hazewinkel) om te zien of je op schema ligt voor 6u15."));
  pc.firstChild.style.cssText="font-size:13px;color:#666;margin-bottom:12px;line-height:1.6";
  
  var dg=div("fg");ap(dg,el("label","fl","Afstand (km)"));
  var di2=el("input");di2.type="number";di2.step="0.5";di2.min="1";di2.max="22";di2.placeholder="bijv. 6";di2.value=ST.pace.dist;
  di2.addEventListener("input",function(){ST.pace.dist=this.value;updatePace();});
  ap(dg,di2);ap(pc,dg);
  
  var tg=div("fg");ap(tg,el("label","fl","Tijd (uu:mm:ss)"));
  var tr3=div("tr");
  var hh=el("input");hh.type="number";hh.min="0";hh.max="10";hh.placeholder="uu";hh.value=ST.pace.hh;hh.style.textAlign="center";
  var mm=el("input");mm.type="number";mm.min="0";mm.max="59";mm.placeholder="mm";mm.value=ST.pace.mm;mm.style.textAlign="center";
  var ss2=el("input");ss2.type="number";ss2.min="0";ss2.max="59";ss2.placeholder="ss";ss2.value=ST.pace.ss;ss2.style.textAlign="center";
  hh.addEventListener("input",function(){ST.pace.hh=this.value;updatePace();});
  mm.addEventListener("input",function(){ST.pace.mm=this.value;updatePace();});
  ss2.addEventListener("input",function(){ST.pace.ss=this.value;updatePace();});
  ap(tr3,hh,span("ts",":"),mm,span("ts",":"),ss2);
  ap(tg,tr3);ap(pc,tg);
  
  var paceResult=div("pace-result-container");
  pc.appendChild(paceResult);
  f.appendChild(pc);
  
  function updatePace(){
    var distVal=parseFloat(ST.pace.dist)||0;
    var totalSec=(parseInt(ST.pace.hh)||0)*3600+(parseInt(ST.pace.mm)||0)*60+(parseInt(ST.pace.ss)||0);
    paceResult.innerHTML="";
    if(distVal<=0||totalSec<=0)return;
    var poolP=totalSec/(distVal*10);
    var owP=poolP*1.07;
    var proj=owP*210;
    var target=375*60;
    var onTrack=proj<=target;
    var close=proj<=target+900;
    var statusC=onTrack?"#1D9E75":close?"#BA7517":"#993C1D";
    var statusT=onTrack?"✅ Op schema voor 6u15!":close?"⚠️ Bijna - iets sneller nodig":"❌ Onder het doeltempo";
    var ph2=Math.floor(proj/3600);
    var pm=Math.floor((proj%3600)/60);
    var pr2=div("pr-res");
    pr2.style.borderColor=statusC;pr2.style.background=statusC+"15";
    var ps=div("pr-s",statusT);ps.style.color=statusC;
    var pd=div("pr-d","Projectie 21 km OW: "+ph2+"u"+pad2(pm)+"min (doel: 6u15)");
    ap(pr2,ps,pd);
    var pg2=div("pr-g");
    var poolMin=Math.floor(poolP/60),poolSec=Math.round(poolP%60);
    var owMin=Math.floor(owP/60),owSec=Math.round(owP%60);
    var margSec=Math.abs(proj-target);
    var margStr=(proj<target?"-":"+")+(Math.floor(margSec/60))+"min";
    [{l:"Pool/100m",v:poolMin+":"+pad2(poolSec),c:"#185FA5"},{l:"OW/100m",v:owMin+":"+pad2(owSec),c:"#854F0B"},{l:"Marge",v:margStr,c:onTrack?"#1D9E75":"#993C1D"}].forEach(function(cell){
      var pc2=div("pr-c");
      var cl=div("pr-cl",cell.l);var cv=div("pr-cv",cell.v);cv.style.color=cell.c;
      ap(pc2,cl,cv);pg2.appendChild(pc2);
    });
    ap(pr2,pg2);
    paceResult.appendChild(pr2);
  }
  updatePace();
  
  // Benchmarks
  f.appendChild(div("st-ttl","Benchmarks"));
  var bc=div("card");
  ap(bc,div("","Sleutelsessies om te controleren of je op schema ligt voor 6u15."));
  bc.firstChild.style.cssText="font-size:13px;color:#666;margin-bottom:12px;line-height:1.6";
  var bl=div("bch-l");
  BENCHMARKS.forEach(function(b){
    var past=curWk>b.wk;
    var now=curWk===b.wk;
    var bi=div("bch");
    bi.style.background=now?"#E6F1FB":past?"#f8f8f6":"#fff";
    if(now)bi.style.border="1px solid #185FA5";
    var ic=span("","");
    ic.textContent=b.ow?"🌊":"🏊";
    ic.style.fontSize="20px";
    var bii=div("bch-i");
    var bt=div("bch-t",b.desc);if(now)bt.style.color="#185FA5";
    var bs=div("bch-s","Wk "+b.wk+" · max "+Math.floor(b.maxMin/60)+"u"+(b.maxMin%60?pad2(b.maxMin%60)+"min":""));
    ap(bii,bt,bs);
    ap(bi,ic,bii);
    if(now){var bn=span("bch-nw","nu");bi.appendChild(bn);}
    else if(past){var bdn=span("","");bdn.textContent="✓";bdn.style.fontSize="18px";bi.appendChild(bdn);}
    bl.appendChild(bi);
  });
  ap(bc,bl);f.appendChild(bc);
  
  // Milestones
  f.appendChild(div("st-ttl","Mijlpalen"));
  var mc=div("card");
  var done=MILESTONES.filter(function(m){return ST.ms[m.id];}).length;
  var pct2=Math.round(done/MILESTONES.length*100);
  var mpg=div("ms-pg");
  var mbw=div("ms-bw");var mbf=div("ms-bf");mbf.style.width=pct2+"%";ap(mbw,mbf);
  var mct=div("ms-ct",done+"/"+MILESTONES.length);
  ap(mpg,mbw,mct);ap(mc,mpg);
  var ml2=div("ms-l");
  MILESTONES.forEach(function(m){
    var done2=ST.ms[m.id]||false;
    var isNow=curWk===m.wk;
    var mi2=div("ms-i");
    mi2.style.background=done2?"#E1F5EE":isNow?"#E6F1FB":"#fff";
    mi2.style.border="1px solid "+(done2?"#1D9E75":isNow?"#185FA5":"rgba(0,0,0,.07)");
    var cb=div("ms-cb");
    cb.style.border="2px solid "+(done2?"#1D9E75":"#ddd");
    cb.style.background=done2?"#1D9E75":"#fff";
    if(done2)cb.textContent="✓";
    var mx=div("ms-tx");
    var mt=div("ms-tt",m.txt);
    mt.style.color=done2?"#1D9E75":isNow?"#185FA5":"#1a1a1a";
    if(done2)mt.style.textDecoration="line-through";
    var ms2=div("ms-sb","Wk "+m.wk+" · "+m.sub);
    ap(mx,mt,ms2);ap(mi2,cb,mx);
    mi2.addEventListener("click",function(){ST.ms[m.id]=!ST.ms[m.id];saveMs(ST.ms);render();});
    ml2.appendChild(mi2);
  });
  ap(mc,ml2);f.appendChild(mc);
  return f;
}
render();
</script>
